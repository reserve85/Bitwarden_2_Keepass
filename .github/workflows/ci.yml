name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows / Python 3.11)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Enforce github_updater SHA pin (no @v tag refs)
        shell: bash
        run: |
          set -euo pipefail
          line="$(grep -E '^github-updater ' requirements.txt | grep -v '^#' || true)"
          if [ -z "$line" ]; then
            echo "ERROR: github-updater is not listed in requirements.txt"
            exit 1
          fi
          ref="$(printf '%s' "$line" | sed -E 's/^github-updater @ .*@([0-9a-fA-F]{40})$/\1/')"
          if [ "$ref" = "$line" ] || [ "${#ref}" -ne 40 ]; then
            echo "ERROR: github-updater must be pinned to a 40-hex commit SHA (tags can be force-moved):"
            echo "  $line"
            exit 1
          fi
          echo "OK: github-updater pinned to $ref"
      - name: Lint (ruff check)
        run: python -m ruff check app/ tests/
      - name: Lint (ruff format --check)
        run: python -m ruff format --check app/ tests/
      - name: Test (pytest, offscreen Qt)
        run: python -m pytest tests/ -q